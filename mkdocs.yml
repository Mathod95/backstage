site_name: Backstage Mathod
site_description: Documentation du Backstage de backstage.mathod.fr
repo_url: https://github.com/Mathod95/backstage
edit_uri: edit/main/docs
# MkDocs always excludes docs/templates/ (reserved for theme templates):
# re-include it, gitignore-style, so the Templates pages are built
exclude_docs: |
  !/templates/

nav:
  - Backstage:
      - Settings: backstage/settings.md
      - Deployment: backstage/deployment.md
      - GitHub sign-in: backstage/github-sign-in.md
      - Catalog: backstage/catalog.md
      - TechDocs: backstage/techdocs.md
      - SQLite removal: backstage/sqlite-removal.md
      - Previous instance: backstage/previous-instance.md
      - Customization:
          - Branding: backstage/personnalisation/branding.md
          - Theme: backstage/personnalisation/theme.md
          - Emerald theme: backstage/personnalisation/emerald-theme.md
          - Custom:
              - Login screen: backstage/personnalisation/custom/login-screen.md
              - Template cards: backstage/personnalisation/custom/template-cards.md
  - Templates:
      - GitHub:
          - Create repository: templates/github/create-repository.md
  - Zensical:
      - Configuration: zensical/configuration.md
      - Authoring: zensical/authoring.md
      - Rules: zensical/rules.md

plugins:
  - techdocs-core
