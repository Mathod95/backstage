name: Build and publish container image

on:
  push:
    branches: [main]
    # Catalog data and docs are read from GitHub at runtime, changing them needs no new image
    paths-ignore:
      - '**.md'
      - 'catalog/**'
      - 'templates/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'catalog-info.yaml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/mathod95/backstage

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must match the Node version used in packages/backend/Dockerfile's FROM image:
      # mismatched versions break native modules (see comment at the top of that Dockerfile).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
