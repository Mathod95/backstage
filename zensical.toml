[project]
# Local preview only (zensical serve -f zensical.toml). The published docs are served
# by TechDocs in Backstage from mkdocs.yml, both read the same docs/ folder.
# site_url = "https://www.example.com/"
site_name = "Backstage Mathod"
site_description = "Documentation du Backstage de backstage.mathod.fr"
site_author = "Mathod"

copyright = "Copyright &copy; 2026 Mathod"

repo_url = "https://github.com/Mathod95/backstage"
repo_name = "Mathod95/backstage"
edit_uri = "edit/main/docs/"

# Same navigation as mkdocs.yml, keep both in sync
nav = [
  { "Accueil" = "index.md" },
  { "Zensical" = [
    { "Authoring" = "zensical/authoring.md" },
    { "Configuration" = "zensical/configuration.md" },
  ] },
  { "Pourquoi Backstage" = "pourquoi-backstage.md" },
  { "Todo" = "todo.md" },
  { "Historique de l'ancienne instance" = "historique-ancienne-instance.md" },
  { "Changements" = [
    { "Retirer les exemples et l'invité" = "retirer-exemples-et-invite.md" },
    { "Catalogue lu depuis GitHub" = "catalogue-depuis-github.md" },
    { "Retirer SQLite de l'image" = "retirer-sqlite-de-l-image.md" },
    { "TechDocs" = "techdocs.md" },
  ] },
  { "Backstage" = [
    { "Personnalisation" = [
      { "Où sont les réglages" = "backstage/personnalisation/reglages.md" },
      { "Thème (MUI et BUI)" = "backstage/personnalisation/theme.md" },
      { "Page de connexion" = "backstage/personnalisation/page-de-connexion.md" },
    ] },
  ] },
]

# Features from https://github.com/Mathod95/zensical (same order as in that repo)
extra_css = ["stylesheets/toggle-sidebar.css", "stylesheets/codeBlock.css", "stylesheets/open-in-new-tab.css", "stylesheets/placeholders.css"]
extra_javascript = ["javascripts/toggle-sidebar.js", "javascripts/codeBlock.js", "javascripts/open-in-new-tab.js", "javascripts/placeholders.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "fr"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
